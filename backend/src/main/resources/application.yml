server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: tallerc4-backend
  jackson:
    default-property-inclusion: non_null
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT_MS:1000}ms
      timeout: ${REDIS_READ_TIMEOUT_MS:1000}ms
sri:
  base-url: ${SRI_BASE_URL:https://srienlinea.sri.gob.ec}
  connect-timeout: ${HTTP_CONNECT_TIMEOUT_MS:3000}ms
  read-timeout: ${HTTP_READ_TIMEOUT_MS:8000}ms
ant:
  provider: ${ANT_PROVIDER:simulated}
  simulation-scenario: ${ANT_SIMULATION_SCENARIO:success}
  real-url: ${ANT_REAL_URL:https://consultaweb.ant.gob.ec/PortalWEB/paginas/clientes/clp_grid_citaciones.jsp}
redis:
  enabled: ${REDIS_ENABLED:false}
  fresh-minutes: ${ANT_CACHE_FRESH_MINUTES:15}
  max-stale-days: ${ANT_CACHE_MAX_STALE_DAYS:7}

